name: check
on:
  pull_request:
  push:
    branches: [main]

jobs:
  flake-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v15
        with:
          name: nix-config-cache-milhamh95
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix flake check
